# Build and push hello-world-server to ECR (and optionally DockerHub)

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      Tag:
        description: "The tag for the Docker image."
        required: true
        default: "latest"
      Environment:
        description: "The environment to deploy to."
        required: true
        type: choice
        options:
          - prod
          - staging
        default: staging

jobs:
  build-aws:
    name: Build and push to Amazon ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.Environment == 'prod' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: ${{ github.event.inputs.Environment == 'prod' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        if: ${{ github.event.inputs.Environment == 'prod' }}
        id: build-image-ecr
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REGISTRY_ALIAS: aktosecurity
          IMAGE_NAME: hello-world-server
          IMAGE_TAG: ${{ github.event.inputs.Tag || 'latest' }}
        run: |
          docker buildx create --use
          docker buildx build --platform linux/arm64/v8,linux/amd64 \
            -t $ECR_REGISTRY/$REGISTRY_ALIAS/$IMAGE_NAME:$IMAGE_TAG \
            . --push
          echo "image=$ECR_REGISTRY/$REGISTRY_ALIAS/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

  build-docker:
    name: Build and push to DockerHub
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: DockerHub login
        if: ${{ github.event.inputs.Environment == 'prod' }}
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD 

      - name: Build, tag, and push the image to DockerHub
        if: ${{ github.event.inputs.Environment == 'prod' }}
        id: build-image-dockerhub
        env:
          ECR_REGISTRY: aktosecurity
          IMAGE_TAG: ${{ github.event.inputs.Tag }}
        run: |
          # Build a docker container and push it to DockerHub 
          docker buildx create --use
          echo "Building and Pushing image to DockerHub..."
          docker buildx build --platform linux/arm64/v8,linux/amd64,linux/arm/v7 -t $ECR_REGISTRY/hello-world:$IMAGE_TAG . --push
          echo "::set-output name=image::$ECR_REGISTRY/hello-world:$IMAGE_TAG"
