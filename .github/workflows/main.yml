# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      Tag: 
        description: "The tag for the Docker image."
        required: true
        default: 'latest'
      EbpfTag: 
        description: "The tag for the eBPF Docker image."
        required: true
        default: 'k8s_ebpf'
      Environment:
        description: "The environment to deploy to."
        required: true
        type: choice
        options:
          - prod
          - staging
        default: staging  
      Module: 
        description: "The module to use for the build process."
        required: true
        type: choice
        options: 
          - legacy
          - ebpf
        default: legacy
      Architecture:
        description: "The target architecture(s) for the Docker image."
        required: true
        type: choice
        options:
          - both
          - arm64
          - amd64
        default: both
      
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-aws:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.16.1' # The Go version to download (if necessary) and use.
      - name: install required packages
        if: ${{ github.event.inputs.Module == 'legacy' }}
        run: sudo apt install libpcap-dev expect
      - name: build go module
        if: ${{ github.event.inputs.Module == 'legacy' }}
        run: go build -o ./mirroring-api-logging

      - name: Set up QEMU (eBPF multi-arch)
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'ebpf' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'ebpf' }}
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.Environment == 'prod' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        if: ${{ github.event.inputs.Environment == 'prod'}}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
          registry-type: public

      - name: Build, tag, and push the image to Amazon ECR
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'legacy'}}
        id: build-image-awsecr
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: akto-api-security
          REGISTRY_ALIAS: p7q3h0z2
          IMAGE_TAG: ${{ github.event.inputs.Tag }}
          ARCH_INPUT: ${{ github.event.inputs.Architecture }}
        run: |
          # Build a docker container and push it to DockerHub 
          docker buildx create --use
          if [ "$ARCH_INPUT" == "arm64" ]; then
            PLATFORM="linux/arm64/v8"
          elif [ "$ARCH_INPUT" == "amd64" ]; then
            PLATFORM="linux/amd64"
          else
            PLATFORM="linux/arm64/v8,linux/amd64"
          fi
          echo "Building and Pushing image to ECR with platform: $PLATFORM"
          docker buildx build --platform $PLATFORM -t $ECR_REGISTRY/$REGISTRY_ALIAS/mirror-api-logging:$IMAGE_TAG . --push
          echo "image=$ECR_REGISTRY/$REGISTRY_ALIAS/mirror-api-logging:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push the image to Amazon ECR -ebpf
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'ebpf'}}
        id: build-image-awsecr-ebpf
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: akto-api-security
          REGISTRY_ALIAS: p7q3h0z2
          IMAGE_TAG: ${{ github.event.inputs.EbpfTag }}
          ARCH_INPUT: ${{ github.event.inputs.Architecture }}
        run: |
          if [ "$ARCH_INPUT" == "arm64" ]; then
            PLATFORM="linux/arm64/v8"
          elif [ "$ARCH_INPUT" == "amd64" ]; then
            PLATFORM="linux/amd64"
          else
            PLATFORM="linux/arm64/v8,linux/amd64"
          fi
          echo "Building and Pushing image to ECR with platform: $PLATFORM"
          docker buildx build --platform $PLATFORM -t $ECR_REGISTRY/$REGISTRY_ALIAS/mirror-api-logging:$IMAGE_TAG -f Dockerfile.eBPF . --push
          echo "image=$ECR_REGISTRY/$REGISTRY_ALIAS/mirror-api-logging:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Requires s3:PutObject on bucket akto-mirroring-module for the CI AWS user.
      - name: Package eBPF core release archives and upload to S3
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'ebpf'}}
        env:
          IMAGE_TAG: ${{ github.event.inputs.EbpfTag }}
          ARCH_INPUT: ${{ github.event.inputs.Architecture }}
          S3_BUCKET: akto-mirroring-module
        run: |
          set -euo pipefail
          make_tar() {
            local arch="$1"
            local platform="$2"
            local dest="export-${arch}"
            rm -rf "$dest"
            docker buildx build -f Dockerfile.eBPF --platform "${platform}" -o "type=local,dest=${dest}" .
            cp scripts/run-ebpf-core-host.sh "${dest}/ebpf/run-ebpf-core-host.sh"
            chmod +x "${dest}/ebpf/run-ebpf-core-host.sh"
            cp scripts/uninstall-ebpf-core-host.sh "${dest}/ebpf/uninstall-ebpf-core-host.sh"
            chmod +x "${dest}/ebpf/uninstall-ebpf-core-host.sh"
            cp scripts/ebpf-core-bundle.env "${dest}/ebpf/.env"
            tar -czf "akto-mirroring-module-${IMAGE_TAG}-${arch}.tar.gz" -C "${dest}" ebpf
            aws s3 cp "akto-mirroring-module-${IMAGE_TAG}-${arch}.tar.gz" "s3://${S3_BUCKET}/"
            rm -rf "$dest" "akto-mirroring-module-${IMAGE_TAG}-${arch}.tar.gz"
          }
          case "$ARCH_INPUT" in
            amd64) make_tar amd64 linux/amd64 ;;
            arm64) make_tar arm64 linux/arm64/v8 ;;
            both)
              make_tar amd64 linux/amd64
              make_tar arm64 linux/arm64/v8
              ;;
            *)
              echo "Unknown Architecture input: $ARCH_INPUT"
              exit 1
              ;;
          esac

  build-docker:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.16.1' # The Go version to download (if necessary) and use.
      - name: install required packages
        if: ${{ github.event.inputs.Module == 'legacy' }}
        run: sudo apt install libpcap-dev expect
      - name: build go module
        if: ${{ github.event.inputs.Module == 'legacy' }}
        run: go build -o ./mirroring-api-logging

      - name: DockerHub login
        if: ${{ github.event.inputs.Environment == 'prod' }}
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD 

      - name: Build, tag, and push the image to DockerHub
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'legacy'}}
        id: build-image-dockerhub
        env:
          ECR_REGISTRY: aktosecurity
          IMAGE_TAG: ${{ github.event.inputs.Tag }}
          ARCH_INPUT: ${{ github.event.inputs.Architecture }}
        run: |
          # Build a docker container and push it to DockerHub 
          docker buildx create --use
          if [ "$ARCH_INPUT" == "arm64" ]; then
            PLATFORM="linux/arm64/v8"
          elif [ "$ARCH_INPUT" == "amd64" ]; then
            PLATFORM="linux/amd64"
          else
            PLATFORM="linux/arm64/v8,linux/amd64"
          fi
          echo "Building and Pushing image to DockerHub with platform: $PLATFORM"
          docker buildx build --platform $PLATFORM -t $ECR_REGISTRY/mirror-api-logging:$IMAGE_TAG . --push
          echo "image=$ECR_REGISTRY/mirror-api-logging:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push the image to DockerHub - ebpf
        if: ${{ github.event.inputs.Environment == 'prod' && github.event.inputs.Module == 'ebpf' }}
        id: build-image-dockerhub-ebpf
        env:
          ECR_REGISTRY: aktosecurity
          IMAGE_TAG: ${{ github.event.inputs.EbpfTag }}
          ARCH_INPUT: ${{ github.event.inputs.Architecture }}
        run: |
          # Build a docker container and push it to DockerHub 
          docker buildx create --use
          if [ "$ARCH_INPUT" == "arm64" ]; then
            PLATFORM="linux/arm64/v8"
          elif [ "$ARCH_INPUT" == "amd64" ]; then
            PLATFORM="linux/amd64"
          else
            PLATFORM="linux/arm64/v8,linux/amd64"
          fi
          echo "Building and Pushing image to DockerHub with platform: $PLATFORM"
          docker buildx build --platform $PLATFORM -t $ECR_REGISTRY/mirror-api-logging:$IMAGE_TAG -f Dockerfile.eBPF . --push
          echo "image=$ECR_REGISTRY/mirror-api-logging:$IMAGE_TAG" >> $GITHUB_OUTPUT
