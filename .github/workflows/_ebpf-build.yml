# Reusable: build Dockerfile.eBPF natively per architecture (amd64 and arm64 in parallel on
# their own runners, no QEMU), push each by digest to ECR Public and DockerHub, then merge
# them into one multi-arch tag for every requested tag.
# Called by staging-ebpf.yml and production-ebpf.yml; not meant to be run directly.
name: _ebpf-build

on:
  workflow_call:
    inputs:
      tags:
        description: "Comma-separated image tags to push (same digest for all)."
        required: true
        type: string
      architecture:
        description: "both | arm64 | amd64"
        required: false
        type: string
        default: both
    outputs:
      digest:
        description: "Digest (sha256:...) of the merged multi-arch manifest."
        value: ${{ jobs.merge.outputs.digest }}

env:
  ECR_IMAGE: public.ecr.aws/p7q3h0z2/mirror-api-logging
  DOCKERHUB_IMAGE: aktosecurity/mirror-api-logging

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      first_tag: ${{ steps.cfg.outputs.first_tag }}
      tags: ${{ steps.cfg.outputs.tags }}
    steps:
      - name: Resolve platforms and tags
        id: cfg
        env:
          ARCH_INPUT: ${{ inputs.architecture }}
          TAGS: ${{ inputs.tags }}
        run: |
          AMD='{"arch":"amd64","runner":"ubuntu-latest"}'
          ARM='{"arch":"arm64","runner":"ubuntu-24.04-arm"}'
          case "$ARCH_INPUT" in
            arm64) MATRIX="[$ARM]" ;;
            amd64) MATRIX="[$AMD]" ;;
            both)  MATRIX="[$AMD,$ARM]" ;;
            *) echo "invalid architecture: $ARCH_INPUT"; exit 1 ;;
          esac
          CLEAN=""
          IFS=',' read -ra T <<< "$TAGS"
          for t in "${T[@]}"; do
            t="$(echo "$t" | xargs)"
            [ -n "$t" ] && CLEAN="${CLEAN:+$CLEAN,}$t"
          done
          [ -z "$CLEAN" ] && { echo "no tags given"; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "tags=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "first_tag=${CLEAN%%,*}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Pushed by digest only (no tag); the merge job creates the tags.
      - name: Build natively and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.eBPF
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_TAG=${{ needs.prepare.outputs.first_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          outputs: type=image,"name=${{ env.ECR_IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch tags
        id: merge
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          cd /tmp/digests
          ls
          for IMG in "$ECR_IMAGE" "$DOCKERHUB_IMAGE"; do
            TAGARGS=""
            IFS=',' read -ra T <<< "$TAGS"
            for t in "${T[@]}"; do TAGARGS="$TAGARGS -t $IMG:$t"; done
            docker buildx imagetools create $TAGARGS $(printf "$IMG@sha256:%s " *)
          done
          FIRST="${TAGS%%,*}"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$FIRST"
          DIGEST=$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$FIRST" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
