# Publishes the Windows package as a GitHub release when a windows-v* tag is pushed, e.g.
#   git tag windows-v1.0.0 && git push origin windows-v1.0.0
# The latest one is then always at
#   https://github.com/akto-api-security/mirroring-api-logging/releases/latest/download/akto-traffic-mirroring-windows.zip

name: Windows release

on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows exe for amd64 and arm64 and package it with the install scripts
        run: VERSION="$GITHUB_REF_NAME" ./windows/build.sh
      - name: Publish the zip as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/akto-traffic-mirroring-windows.zip \
            --title "Windows traffic collector $GITHUB_REF_NAME" \
            --notes "Windows traffic collector for x64 and ARM64: install.ps1 installs the exe matching the machine's CPU." \
            --latest
