# Publishes the Windows package as a GitHub release when a windows-v* tag is pushed, e.g.
#   git tag windows-v1.0.0 && git push origin windows-v1.0.0
# The latest one is then always at
#   https://github.com/akto-api-security/mirroring-api-logging/releases/latest/download/akto-traffic-mirroring-windows-amd64.zip

name: Windows release

on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows exe and package it with the install scripts
        run: ./windows/build.sh
      - name: Publish the zip as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/akto-traffic-mirroring-windows-amd64.zip \
            --title "Windows traffic collector $GITHUB_REF_NAME" \
            --notes "Windows traffic collector package: mirroring-api-logging.exe, install.ps1 and uninstall.ps1." \
            --latest
